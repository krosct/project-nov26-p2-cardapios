[project]
name = "project-nov26-p2-cardapios"
version = "0.1.0"
description = "Extração estruturada de cardápios com LLM: texto bagunçado → JSON validado, com avaliação por campo contra gabarito."
readme = "README.md"
authors = [
    { name = "Gabriel MS", email = "krosct@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.42.1",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]   # erros, imports, bugs comuns, sintaxe moderna

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
